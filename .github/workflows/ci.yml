# Kozy automatic tests — run on every push and pull request, so a change that breaks something is caught before it goes live.
# (GitHub emails you when a run fails.)
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: App tests (36, browser + logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  firebase:
    name: Rules + multi-user app + backup (Firebase emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install --prefix tools/reminders --no-audit --no-fund
      - run: npm ci
        working-directory: tests-rules
      - run: npm test
        working-directory: tests-rules
      - run: npm run test:app
        working-directory: tests-rules
      - run: npm run test:backup
        working-directory: tests-rules
